name: CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - '*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      changelog_version:
        description: "Optional semantic version to release, such as 0.1.0"
        required: false
        type: string
      changelog_date:
        description: "Optional release date in YYYY-MM-DD format"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24.x
  SOLUTION_FILE: SporeSync.sln
  WEB_PROJECT: SporeSync.Web/SporeSync.Web.csproj
  CLIENT_APP: SporeSync.Web/ClientApp
  BUILD_CONFIGURATION: Release
  CONTAINER_REGISTRY: ghcr.io

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_APP }}/package-lock.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Validate changelog generator
        run: bash -n scripts/update-changelog.sh

      - name: Restore frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm run lint

      - name: Test frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm run test

      - name: Build frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm run build

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          !contains(github.event.head_commit.message, '[skip changelog]')
        )
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        shell: bash
        env:
          CHANGELOG_VERSION: ${{ inputs.changelog_version }}
          CHANGELOG_DATE: ${{ inputs.changelog_date }}
        run: |
          if [[ -n "${CHANGELOG_VERSION}" ]]; then
            args=(--version "${CHANGELOG_VERSION}")
            if [[ -n "${CHANGELOG_DATE}" ]]; then
              args+=(--date "${CHANGELOG_DATE}")
            fi
            scripts/update-changelog.sh "${args[@]}"
          else
            scripts/update-changelog.sh
          fi

      - name: Commit changelog
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip changelog]"
          git push

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_APP }}/package-lock.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Publish
        run: >
          dotnet publish ${{ env.WEB_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --output ./artifacts/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sporesync-web
          path: ./artifacts/publish

  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_APP }}/package-lock.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          tag="sha-${short_sha}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" && ("${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master") ]]; then
            tag="latest"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"

            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              tag="${version}"
            else
              echo "::error::Docker release tags must use semantic versioning, such as v1.2.3 or 1.2.3."
              exit 1
            fi
          fi

          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: >
          dotnet publish ${{ env.WEB_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          /t:PublishContainer
          -p:ContainerRegistry=${{ env.CONTAINER_REGISTRY }}
          -p:ContainerRepository=${{ steps.image.outputs.repository }}
          -p:ContainerImageTag=${{ steps.image.outputs.tag }}
