name: CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - '*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24.x
  SOLUTION_FILE: SporeSync.sln
  WEB_PROJECT: SporeSync.Web/SporeSync.Web.csproj
  CLIENT_APP: SporeSync.Web/ClientApp
  BUILD_CONFIGURATION: Release
  CONTAINER_REGISTRY: ghcr.io

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_APP }}/package-lock.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Restore frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm run lint

      - name: Test frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm run test

      - name: Build frontend
        working-directory: ${{ env.CLIENT_APP }}
        run: npm run build

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_APP }}/package-lock.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Publish
        run: >
          dotnet publish ${{ env.WEB_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --output ./artifacts/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sporesync-web
          path: ./artifacts/publish

  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_APP }}/package-lock.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          tags="sha-${short_sha}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" && ("${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master") ]]; then
            tags="${tags};latest"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"

            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              tags="${version};${tags}"

              if [[ "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                tags="${BASH_REMATCH[1]}.${BASH_REMATCH[2]};${tags}"
                tags="${BASH_REMATCH[1]};${tags}"
              fi
            else
              echo "::error::Docker release tags must use semantic versioning, such as v1.2.3 or 1.2.3."
              exit 1
            fi
          fi

          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: >
          dotnet publish ${{ env.WEB_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          /t:PublishContainer
          -p:ContainerRegistry=${{ env.CONTAINER_REGISTRY }}
          -p:ContainerRepository=${{ steps.image.outputs.repository }}
          -p:ContainerImageTags="${{ steps.image.outputs.tags }}"
