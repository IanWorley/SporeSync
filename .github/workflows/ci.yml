name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Docker is available
        run: docker info
      - name: Set up Temurin JDK 17 for the Elide plugin
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Temurin JDK 25 for the backend
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle.lockfile
            backend/scripts/prepare-elide-plugin.sh
      - name: Verify Java toolchains
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          test -x "$JAVA_HOME_25_X64/bin/java"
          "$JAVA_HOME_17_X64/bin/java" -version
          "$JAVA_HOME_25_X64/bin/java" -version
      - name: Prepare the pinned Elide Gradle plugin source
        run: bash scripts/prepare-elide-plugin.sh
      - name: Build and test the backend
        run: ./gradlew -Porg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_25_X64" build
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-reports
          path: |
            backend/build/reports/spotbugs/main.xml
            backend/build/reports/spotbugs/main.html
            backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  scanner:
    name: Scanner unit and SSH tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Docker and OpenSSH are available
        run: |
          docker info
          command -v ssh
          command -v ssh-keygen
      - name: Run scanner unit and real SSH tests
        env:
          SPORESYNC_SSH_TEST: '1'
        run: python3 -m unittest discover -s tests -v
