name: Publish container

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  container:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag sporesync:verify .
      - name: Verify frontend and backend in the image
        run: bash scripts/verify-container.sh sporesync:verify
      - name: Publish verified image to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Git tag must also be a valid Docker tag.' >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          docker tag sporesync:verify "$image:$RELEASE_TAG"
          docker push "$image:$RELEASE_TAG"
