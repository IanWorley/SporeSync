spring.application.name=sporesync
server.address=127.0.0.1
spring.liquibase.change-log=file:./config/db/changelog.yaml
spring.devtools.livereload.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Elide does not copy classpath resources; deploy the Vite output alongside the backend.
spring.web.resources.static-locations=${SPORESYNC_STATIC_LOCATION:file:../frontend/dist/}
