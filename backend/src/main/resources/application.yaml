sporesync:
  persistence:
    # H2 keeps its data files in the /config volume, next to the settings file.
    directory: /config
    database-name: sporesync

spring:
  application:
    name: sporesync
  datasource:
    # File mode so data survives restarts. Spring closes the database on shutdown, not H2's JVM hook.
    url: jdbc:h2:file:${sporesync.persistence.directory}/${sporesync.persistence.database-name};DB_CLOSE_ON_EXIT=FALSE
  jpa:
    # Liquibase owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  structured:
    # One JSON object per line on stdout (Elastic Common Schema).
    format:
      console: ecs
  level:
    # Debug toggle. The config module (#7) maps the General > debug setting onto this level;
    # until then it can be overridden with LOGGING_LEVEL_COM_SPORESYNC=DEBUG.
    com.sporesync: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
